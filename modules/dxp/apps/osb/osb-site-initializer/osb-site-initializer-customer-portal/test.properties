##
## Test Suites
##

test.batch.names[relevent][cookie-rule]=\
	functional-bundle-tomcat-mysql57-jdk8,\
	functional-tomcat*-mysql*-jdk8,\
	functional-tomcat*-mysql*-jdk8

relevant.rule.names=\
	osb-site-initializer-customer-portal-rule

modified.files.includes[relevant][osb-site-initializer-customer-portal-rule]=*

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][osb-site-initializer-customer-portal-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][osb-site-initializer-customer-portal-rule]=\
        (portal.acceptance == true) AND \
        (\
            (testray.component.names ~ "OSB Site Initializer Customer Portal") OR \
            (testray.main.component.name ~ "OSB Site Initializer Customer Portal")\
        )