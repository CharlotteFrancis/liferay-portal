##
## Test Suites
##


	modified.files.includes[relevant][portal-search-learning-to-rank-rule]=*

	relevant.rule.names=\
		portal-search-learning-to-rank-rule

	test.batch.names[relevent][portal-search-learning-to-rank-rule]=\
		functional-bundle-tomcat-mysql57-jdk8,\
		functional-tomcat*-mysql*-jdk8,\
		functional-tomcat*-mysql*-jdk8,\
		functional-upgrade-tomcat*-mysql*-jdk8

    modules.includes.required[relevant][portal-search-learning-to-rank-rule]=\
        apps/portal-search,\
        apps/portal-search-elasticsearch7


    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][portal-search-learning-to-rank-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][portal-search-learning-to-rank-rule]=\
        (portal.acceptance == true) AND \
        (portal.suite.search.engine ~ "elasticsearch7")

    test.batch.run.property.query[functional-upgrade-tomcat*-mysql*-jdk8][relevant][portal-search-learning-to-rank-rule]=\
        (portal.suite.search.engine ~ "elasticsearch7") AND \
        (testray.main.component.name ~ "Upgrades Search")

##
## Testray
##

    testray.main.component.name=Elasticsearch Impl