	modified.files.includes[relevant][portal-workflow-metrics-rest-impl-rule]=*

	relevant.rule.names=\
		portal-workflow-metrics-rest-impl-rule

	test.batch.names[relevent][portal-workflow-metrics-rest-impl-rule]=\
		functional-bundle-tomcat-mysql57-jdk8,\
		functional-tomcat*-mysql*-jdk8,\
		functional-tomcat*-mysql*-jdk8

    modules.includes.required.test.batch.class.names.includes[relevant][portal-workflow-metrics-rest-impl-rule]=\
        apps/portal-workflow/**/*Test.java,\
        dxp/portal-workflow/**/*Test.java


    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][portal-workflow-metrics-rest-impl-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][portal-workflow-metrics-rest-impl-rule]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name ~ "Workflow Metrics")