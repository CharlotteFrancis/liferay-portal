##
## Test Suites
##


	modified.files.includes[relevant][search-experiences-rule]=*

	relevant.rule.names=\
		search-experiences-rule

	test.batch.names[relevent][search-experiences-rule]=\
		functional-bundle-tomcat-mysql57-jdk8,\
		functional-tomcat*-mysql*-jdk8,\
		functional-tomcat*-mysql*-jdk8,\
		functional-upgrade-tomcat*-mysql*-jdk8
##
## Backend Tests
##

    modules.includes.required[relevant][search-experiences-rule]=\
        apps/portal-search,\
        apps/portal-search-elasticsearch7

##
## Functional Tests
##

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][search-experiences-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][search-experiences-rule]=\
        (test.class.name == Blueprints) OR \
        (test.class.name == SemanticSearch)

    test.batch.run.property.query[functional-upgrade-tomcat*-mysql*-jdk8][relevant][search-experiences-rule]=\
        (portal.suite.search.engine ~ "elasticsearch7") AND \
        (testray.main.component.name ~ "Upgrades Search")

##
## Playwright
##

    playwright.test.project[playwright-js-tomcat90-mysql57-jdk8][relevant][search-experiences-rule]=search-experiences-web

##
## Testray
##

    testray.main.component.name=Search Experiences