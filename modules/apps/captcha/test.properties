##
## Test Suites
##


	modified.files.includes[relevant][captcha-rule]=*

	relevant.rule.names=\
		captcha-rule

	test.batch.names[relevent][captcha-rule]=\
		functional-bundle-tomcat-mysql57-jdk8,\
		functional-tomcat*-mysql*-jdk8,\
		functional-tomcat*-mysql*-jdk8

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][captcha-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][captcha-rule]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name ~ "CAPTCHA")

