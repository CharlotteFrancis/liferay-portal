##
## Test Suites
##

    modified.files.includes[relevant][portal-reports-engine-rule]=*

    relevant.rule.names=\
        portal-reports-engine-rule

    test.batch.names[relevent][portal-reports-engine-rule]=\
        functional-bundle-tomcat-mysql57-jdk8,\
        functional-tomcat*-mysql*-jdk8,\
        functional-tomcat*-mysql*-jdk8

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][portal-reports-engine-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][portal-reports-engine-rule]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name ~ "Reports")

##
## Testray
##

    testray.main.component.name=Reports