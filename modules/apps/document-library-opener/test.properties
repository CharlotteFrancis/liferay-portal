##
## Test Suites
##

    test.batch.names[relevent][document-library-opener-rule]=\
        functional-bundle-tomcat-mysql57-jdk8,\
        functional-tomcat*-mysql*-jdk8,\
        functional-tomcat*-mysql*-jdk8

    relevant.rule.names=\
        document-library-opener-rule

    modified.files.includes[relevant][document-library-opener-rule]=*

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][document-library-opener-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][document-library-opener-rule]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name ~ "Online Editing")

