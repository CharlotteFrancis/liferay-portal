##
## Test Suites
##

test.batch.names[relevent][testFunctional-rule]=\
	functional-bundle-tomcat-mysql57-jdk8,\
	functional-tomcat*-mysql*-jdk8

relevant.rule.names=\
	portal-vulcan-rule

modified.files.includes[relevant][portal-vulcan-rule]=*

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][portal-vulcan-rule]}

    #
    # Relevant
    #

    test.batch.class.names.includes[relevant][portal-vulcan-rule]=\
        **/portal-vulcan/**/*Test.java

##
## Testray
##

    testray.main.component.name=Headless