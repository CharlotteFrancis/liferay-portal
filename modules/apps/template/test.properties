##
## Test Suites
##

    test.batch.names[relevent][template-rule]=\
        functional-bundle-tomcat-mysql57-jdk8,\
        functional-tomcat*-mysql*-jdk8,\
        functional-tomcat*-mysql*-jdk8

    relevant.rule.names=\
        template-rule

    modified.files.includes[relevant][template-rule]=*

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][template-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][template-rule]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name ~ "Templates")

##
## Testray
##

    testray.main.component.name=Templates