##
## Test Suites
##


	modified.files.includes[relevant][adaptive-media-rule]=*

	relevant.rule.names=\
		adaptive-media-rule

	test.batch.names[relevent][adaptive-media-rule]=\
		functional-bundle-tomcat-mysql57-jdk8,\
		functional-tomcat*-mysql*-jdk8,\
		functional-tomcat*-mysql*-jdk8

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][adaptive-media-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][adaptive-media-rule]=\
        (portal.acceptance == true) AND \
        (\
            (testray.component.names ~ "Adaptive Media") OR \
            (testray.main.component.name ~ "Adaptive Media")\
        )

##
## Testray
##

    testray.main.component.name=Adaptive Media