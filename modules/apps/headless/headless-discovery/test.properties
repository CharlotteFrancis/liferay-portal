##
## Test Suites
##

test.batch.names[relevent][testFunctional-rule]=\
	functional-bundle-tomcat-mysql57-jdk8,\
	functional-tomcat*-mysql*-jdk8,\
	functional-tomcat*-mysql*-jdk8

relevant.rule.names=\
	headless-discovery-rule

modified.files.includes[relevant][headless-discovery-rule]=*

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][headless-discovery-rule]}

    #
    # Relevant
    #

    test.batch.class.names.includes[relevant][headless-discovery-rule]=\
        **/headless-discovery/**/*Test.java

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][headless-discovery-rule]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name == "Headless Discovery Application")

##
## Testray
##

testray.main.component.name=Headless Discovery Application