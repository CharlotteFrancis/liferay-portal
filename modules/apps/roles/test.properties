##
## Test Batch
##

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][roles-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][roles-rule]=\
        (portal.acceptance == true) AND \
        (\
            (testray.component.names ~ "Roles") OR \
            (testray.main.component.name ~ "Roles")\
        )

##
## Test Suites
##

    test.batch.names[relevant][roles-rule]=\
        functional-bundle-tomcat-mysql57-jdk8,\
        functional-tomcat*-mysql*-jdk8,\
        functional-tomcat*-mysql*-jdk8

    relevant.rule.names=\
        roles-rule

    modified.files.includes[relevant][roles-rule]=*

##
## Testray
##

    testray.main.component.name=Roles