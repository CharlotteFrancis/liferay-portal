##
## Test Suites
##


	modified.files.includes[relevant][user-groups-admin-rule]=*

	relevant.rule.names=\
		user-groups-admin-rule

	test.batch.names[relevent][user-groups-admin-rule]=\
		functional-bundle-tomcat-mysql57-jdk8,\
		functional-tomcat*-mysql*-jdk8,\
		functional-tomcat*-mysql*-jdk8

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][user-groups-admin-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][user-groups-admin-rule]=\
        (portal.acceptance == true) AND \
        (\
            (testray.component.names ~ "User Groups") OR \
            (testray.main.component.name ~ "User Groups")\
        )

##
## Testray
##

    testray.main.component.name=User Groups