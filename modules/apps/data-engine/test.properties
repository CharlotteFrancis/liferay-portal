##
## Test Suites
##

    modified.files.includes[relevant][data-engine-rule]=*

    relevant.rule.names=\
        data-engine-rule

    test.batch.names[relevent][data-engine-rule]=\
        functional-bundle-tomcat-mysql57-jdk8,\
        functional-tomcat*-mysql*-jdk8,\
        functional-tomcat*-mysql*-jdk8

    modules.includes.required.functional[relevant][data-engine-rule]=\
        apps/dynamic-data-lists,\
        apps/dynamic-data-mapping

    modules.includes.required.test.batch.class.names.includes[relevant][data-engine-rule]=\
        apps/company/**/CompanyLocalServiceTest.java,\
        apps/dynamic-data-lists/**/*Test.java,\
        apps/dynamic-data-mapping/**/*Test.java

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-mysql57-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][data-engine-rule]}

    #
    # Relevant
    #

    test.batch.run.property.query[functional-tomcat*-mysql*-jdk8][relevant][data-engine-rule]=\
        (portal.acceptance == true) AND \
        (\
            (testray.component.names ~ "data-engine") OR \
            (testray.main.component.name ~ "Data Engine")\
        )

##
## Testray
##

    testray.main.component.name=Data Engine